<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>d 轨道面对面成键 · δ 键</title>
<style>
  :root{
    --bg:#0a0c11; --panel:#12151d; --line:#232838; --text:#e8edf7;
    --dim:#8d99b0; --accent:#6ea8fe; --pos:#ff6b5e; --neg:#5b93ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden}
  #app{display:flex;height:100%}
  #stage{position:relative;flex:1;min-width:0;cursor:grab}
  #stage.dragging{cursor:grabbing}
  #gl,#ov{position:absolute;inset:0;width:100%;height:100%;display:block}
  #ov{pointer-events:none}

  #ui{width:330px;flex:0 0 330px;background:var(--panel);border-left:1px solid var(--line);
    padding:22px 20px 16px;display:flex;flex-direction:column;gap:15px;overflow-y:auto}
  #ui h1{font-size:17px;margin:0 0 2px;font-weight:600;letter-spacing:.02em}
  #ui .sub{font-size:12px;color:var(--dim);line-height:1.55;margin:0}

  .group{display:flex;flex-direction:column;gap:8px}
  .group-label{font-size:11px;letter-spacing:.09em;color:var(--dim);text-transform:uppercase}
  .pills{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
  .pills.two{grid-template-columns:1fr 1fr}
  .pill{appearance:none;border:1px solid var(--line);background:#181c26;color:var(--text);
    border-radius:9px;padding:9px 4px;font-size:12.5px;cursor:pointer;transition:.15s;
    font-family:inherit;line-height:1.15;text-align:center}
  .pill:hover{background:#1e2431;border-color:#2f3651}
  .pill.on{background:rgba(110,168,254,.16);border-color:rgba(110,168,254,.7);color:#d5e5ff}
  .pill small{display:block;font-size:10px;color:var(--dim);margin-top:3px;font-weight:400}
  .pill.on small{color:#9dbdf0}

  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;color:#c3ccdd}
  input[type=range]{-webkit-appearance:none;width:100%;height:22px;background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;
    background:linear-gradient(90deg,#3d4a68,#6ea8fe)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
    background:#dce7ff;border:2px solid #4a6ea8;margin-top:-5.5px;box-shadow:0 0 8px rgba(110,168,254,.5)}
  .val{font-variant-numeric:tabular-nums;color:#9fb4d8;font-size:12px;min-width:62px;text-align:right}

  .switch{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:#c3ccdd;
    cursor:pointer;user-select:none;padding:2px 0}
  .switch .track{width:38px;height:21px;border-radius:11px;background:#2a3042;position:relative;transition:.18s;flex:0 0 auto}
  .switch .track::after{content:"";position:absolute;top:3px;left:3px;width:15px;height:15px;border-radius:50%;
    background:#8f9bb3;transition:.18s}
  .switch.on .track{background:rgba(110,168,254,.42)}
  .switch.on .track::after{left:20px;background:#dbe8ff}

  .legend{display:flex;gap:14px;font-size:12px;color:#a9b5c9;align-items:center}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:1px}
  .dot.p{background:var(--pos);box-shadow:0 0 9px rgba(255,107,94,.65)}
  .dot.n{background:var(--neg);box-shadow:0 0 9px rgba(91,147,255,.65)}

  .readout{background:#161a24;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
    display:flex;flex-direction:column;gap:4px}
  .readout .k{font-size:11px;color:var(--dim);letter-spacing:.05em}
  .readout .v{font-size:20px;font-variant-numeric:tabular-nums;color:#cfe1ff;line-height:1.1}
  .readout .n{font-size:11px;color:#7d8aa0;line-height:1.5}

  .btn{appearance:none;border:1px solid var(--line);background:#181c26;color:#cfd8e8;
    border-radius:9px;padding:9px 8px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:.15s}
  .btn:hover{background:#1e2431;border-color:#313a55}
  .btn.primary{background:rgba(110,168,254,.16);border-color:rgba(110,168,254,.55);color:#d5e5ff}

  .note{font-size:11.5px;color:#8491a8;line-height:1.75}
  .note b{color:#b9c6dc;font-weight:600}
  .hint{font-size:11.5px;color:#6d788e;line-height:1.7;margin-top:auto}
  .hint kbd{background:#1c2230;border:1px solid #2a3145;border-radius:4px;padding:0 4px;font-size:10.5px;
    font-family:inherit;color:#9aa7bf}
  #status{font-size:11px;color:#5f6b80;min-height:14px}
  body.export #ui{display:none}
  @media (max-width:820px){
    #app{flex-direction:column}
    #ui{width:auto;flex:0 0 auto;max-height:46vh;border-left:0;border-top:1px solid var(--line)}
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="gl"></canvas>
    <canvas id="ov"></canvas>
  </div>
  <aside id="ui">
    <div>
      <h1>d 轨道面对面成键</h1>
      <p class="sub">两个中心上的 d 轨道平行靠近、同号瓣正面重叠 → δ 键</p>
    </div>

    <div class="group">
      <div class="group-label">组合方式</div>
      <div class="pills" id="modeBtns">
        <button class="pill" data-mode="0">分开看<small>两个独立轨道</small></button>
        <button class="pill on" data-mode="1">成键<small>φA + φB</small></button>
        <button class="pill" data-mode="2">反键<small>φA − φB</small></button>
      </div>
    </div>

    <div class="group">
      <div class="group-label">轨道类型</div>
      <div class="pills two" id="orbBtns">
        <button class="pill on" data-orb="2">d<sub>xy</sub></button>
        <button class="pill" data-orb="1">d<sub>x²−y²</sub></button>
      </div>
    </div>

    <div class="group">
      <div class="row"><span>键长 d</span><span class="val" id="distVal">7.0 a₀</span></div>
      <input type="range" id="dist" min="30" max="180" value="70">
    </div>

    <div class="group">
      <div class="row"><span>轨道缩放（示意）</span><span class="val" id="scaleVal">0.50×</span></div>
      <input type="range" id="scale" min="35" max="100" value="50">
      <div class="note" style="padding:0">自由原子的 3d 轨道半径约 10 a₀，比任何键长都大；
        这里按比例缩小，只为看清“面对面”的重叠。1.00× 就是真实比例（会完全糊在一起）。</div>
    </div>

    <div class="group">
      <div class="row"><span>电子云范围</span><span class="val" id="isoVal">0.46</span></div>
      <input type="range" id="iso" min="20" max="70" value="46">
    </div>

    <div class="group">
      <div class="switch" id="swPhase"><span>相位配色（红 ψ&gt;0 / 蓝 ψ&lt;0）</span><span class="track"></span></div>
      <div class="switch" id="swNuc"><span>显示原子核与键轴</span><span class="track"></span></div>
      <div class="switch" id="swAuto"><span>自动旋转</span><span class="track"></span></div>
    </div>

    <div class="readout">
      <span class="k">重叠积分 S</span>
      <span class="v" id="sVal">—</span>
      <span class="n" id="sNote">S 越大，成键与反键的能级分裂越大</span>
    </div>

    <div class="note" id="explain"></div>

    <button class="btn primary" id="save">保存 PNG</button>
    <div id="status"></div>

    <div class="hint">拖拽旋转 · 滚轮缩放 · <kbd>1</kbd>/<kbd>2</kbd>/<kbd>3</kbd> 切组合 · <kbd>空格</kbd> 自动旋转</div>
  </aside>
</div>

<script>
"use strict";

/* ---------------- 轨道定义（与 d 轨道页一致，a0 = 1） ---------------- */
const A20 = 0.31539156525, A21 = 0.54627421529, A22 = 0.54627421529;
const PEAK = A20 * 2 * 36 * Math.exp(-2);

const params = new URLSearchParams(location.search);
const EXPORT = params.get("export") === "1";
const FOV = 30 * Math.PI / 180;

const state = {
  mode: 1,          // 0 分开 / 1 成键 / 2 反键
  orb: 2,           // 2 = dxy, 1 = dx2-y2
  d: 7,             // 键长（a0）
  scale: 0.5,       // 轨道示意缩放
  iso: 0.46,
  phase: true,
  nuc: true,
  auto: true,
  yaw: 1.15,
  pitch: 0.26,
  zoom: 1,
};

const stage = document.getElementById("stage");
const glc = document.getElementById("gl");
const ovc = document.getElementById("ov");
const ctx = ovc.getContext("2d");

const gl = glc.getContext("webgl2", {
  antialias: true, alpha: false, depth: false, stencil: false,
  preserveDrawingBuffer: true, powerPreference: "high-performance",
});
if (!gl) {
  stage.innerHTML = '<div style="color:#fff;padding:40px;font-size:15px">浏览器不支持 WebGL2，请用新版 Edge / Chrome。</div>';
  throw new Error("no webgl2");
}

const VS = `#version 300 es
in vec2 aPos;
void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }`;

const FS = `#version 300 es
precision highp float;
out vec4 fragColor;

uniform vec2  uRes;
uniform vec2  uOrigin;
uniform mat3  uCam;
uniform vec3  uCamPos;
uniform float uFocal;
uniform float uD;        // 半键长
uniform int   uOrb;
uniform int   uMode;     // 0 分开 / 1 成键 / 2 反键
uniform float uC;
uniform float uPeak;
uniform int   uPhase;
uniform int   uNuc;
uniform float uAxisLen;
uniform float uBound;
uniform float uScale;    // 轨道示意缩放

const float A20 = 0.31539156525;
const float A21 = 0.54627421529;
const float A22 = 0.54627421529;
const int   STEPS = 128;

float angY(vec3 d, int orb){
  if (orb == 0) return A20 * (3.0 * d.z * d.z - 1.0);
  if (orb == 1) return A22 * (d.x * d.x - d.y * d.y);
  if (orb == 2) return A22 * 2.0 * d.x * d.y;
  if (orb == 3) return A21 * 2.0 * d.x * d.z;
  return A21 * 2.0 * d.y * d.z;
}

float psi1(vec3 q, int orb){
  vec3 p = q / uScale;
  float r2 = dot(p, p);
  float r  = sqrt(r2);
  vec3  d  = p / max(r, 1e-6);
  return r2 * exp(-r * 0.3333333333) * angY(d, orb) / uPeak;
}

float psiA(vec3 p){ return psi1(p - vec3(0.0, 0.0, uD), uOrb); }
float psiB(vec3 p){ return psi1(p + vec3(0.0, 0.0, uD), uOrb); }

// which: 0 = A, 1 = B, 2 = 成键, 3 = 反键
float psiWhich(vec3 p, int which){
  if (which == 0) return psiA(p);
  if (which == 1) return psiB(p);
  if (which == 2) return (psiA(p) + psiB(p)) * 0.70710678;
  return (psiA(p) - psiB(p)) * 0.70710678;
}

float fieldAt(vec3 p, int which){ return abs(psiWhich(p, which)) - uC; }

bool sphereIn(vec3 ro, vec3 rd, float R, out float t0, out float t1){
  float b = dot(ro, rd);
  float c = dot(ro, ro) - R * R;
  float h = b * b - c;
  if (h < 0.0){ t0 = 0.0; t1 = 0.0; return false; }
  h = sqrt(h);
  t0 = -b - h;
  t1 = -b + h;
  return t1 > 0.0;
}

float trace(vec3 ro, vec3 rd, int which, out float sgn){
  sgn = 0.0;
  float t0, t1;
  if (!sphereIn(ro, rd, uBound, t0, t1)) return -1.0;
  t0 = max(t0, 0.0);
  float dt = (t1 - t0) / float(STEPS);
  float tp = t0;
  float fp = fieldAt(ro + rd * t0, which);
  for (int i = 1; i <= STEPS; i++){
    float tc = t0 + dt * float(i);
    float fc = fieldAt(ro + rd * tc, which);
    if (fc > 0.0 && fp <= 0.0){
      float a = tp, b = tc;
      for (int k = 0; k < 7; k++){
        float m = 0.5 * (a + b);
        if (fieldAt(ro + rd * m, which) > 0.0) b = m; else a = m;
      }
      float th = 0.5 * (a + b);
      sgn = psiWhich(ro + rd * th, which);
      return th;
    }
    tp = tc; fp = fc;
  }
  return -1.0;
}

vec3 shade(vec3 p, vec3 rd, float sgn, int which){
  float e = uBound * 0.0022;
  vec3 g = vec3(
    psiWhich(p + vec3(e,0.0,0.0), which) - psiWhich(p - vec3(e,0.0,0.0), which),
    psiWhich(p + vec3(0.0,e,0.0), which) - psiWhich(p - vec3(0.0,e,0.0), which),
    psiWhich(p + vec3(0.0,0.0,e), which) - psiWhich(p - vec3(0.0,0.0,e), which)
  );
  vec3 n = (length(g) > 1e-14) ? normalize(g) : vec3(0.0,0.0,1.0);
  n = -sign(sgn) * n;

  vec3 L1 = normalize(vec3(-0.34, 0.74, 0.58));
  vec3 L2 = normalize(vec3(0.72, -0.18, 0.32));
  float d1 = max(dot(n, L1), 0.0);
  float d2 = max(dot(n, L2), 0.0);
  float amb = 0.52 + 0.26 * (0.5 + 0.5 * n.y);

  vec3 base = (uPhase == 1)
    ? (sgn > 0.0 ? vec3(1.00, 0.38, 0.32) : vec3(0.34, 0.58, 1.00))
    : vec3(0.62, 0.75, 0.94);

  vec3 col = base * (amb + 0.72 * d1 + 0.20 * d2);
  vec3 hv = normalize(L1 - rd);
  col += vec3(0.92,0.96,1.0) * pow(max(dot(n, hv), 0.0), 52.0) * 0.22;
  float rim = pow(1.0 - clamp(dot(n, -rd), 0.0, 1.0), 3.6);
  col += base * rim * 0.42;
  float edge = pow(1.0 - abs(dot(n, L1)), 2.0);
  col *= 1.0 - 0.22 * edge;
  return col;
}

// 核：小球
float hitSphere(vec3 ro, vec3 rd, vec3 c, float r, out vec3 nrm){
  vec3 oc = ro - c;
  float b = dot(oc, rd);
  float q = dot(oc, oc) - r * r;
  float h = b * b - q;
  nrm = vec3(0.0, 0.0, 1.0);
  if (h < 0.0) return -1.0;
  h = sqrt(h);
  float t = -b - h;
  if (t < 0.0) t = -b + h;
  if (t < 0.0) return -1.0;
  nrm = normalize(ro + rd * t - c);
  return t;
}

bool cylAxis(vec3 ro, vec3 rd, int ax, float L, float rad, out float tOut, out vec3 nOut){
  vec2 oc, dc; float oa, da;
  if (ax == 0){ oc = ro.yz; dc = rd.yz; oa = ro.x; da = rd.x; }
  else if (ax == 1){ oc = ro.xz; dc = rd.xz; oa = ro.y; da = rd.y; }
  else { oc = ro.xy; dc = rd.xy; oa = ro.z; da = rd.z; }
  float A = dot(dc, dc);
  if (A < 1e-9) return false;
  float B = 2.0 * dot(oc, dc);
  float C = dot(oc, oc) - rad * rad;
  float disc = B * B - 4.0 * A * C;
  if (disc < 0.0) return false;
  float sq = sqrt(disc);
  float ts0 = (-B - sq) / (2.0 * A);
  float ts1 = (-B + sq) / (2.0 * A);
  for (int k = 0; k < 2; k++){
    float t = (k == 0) ? ts0 : ts1;
    if (t > 0.0){
      float a = oa + da * t;
      if (abs(a) <= L){
        vec3 p = ro + rd * t;
        vec3 dd = p; if (ax == 0) dd.x = 0.0; else if (ax == 1) dd.y = 0.0; else dd.z = 0.0;
        nOut = normalize(dd + vec3(1e-9));
        tOut = t;
        return true;
      }
    }
  }
  return false;
}

void main(){
  vec2 fc = gl_FragCoord.xy - uOrigin;
  vec3 rd = normalize(uCam * vec3((fc - 0.5 * uRes) / uFocal, 1.0));
  vec3 ro = uCamPos;

  vec2 q = fc / uRes;
  float rr = length(q - vec2(0.5));
  vec3 bg = mix(vec3(0.068,0.076,0.098), vec3(0.014,0.017,0.025), smoothstep(0.10,0.92,rr));
  bg += vec3(0.018,0.026,0.042) * pow(max(0.0, 1.0 - rr*1.55), 2.2);

  vec3 col = bg;
  float tBest = 1e9;
  vec3 colBest = bg;
  int got = 0;

  if (uMode == 0){
    for (int w = 0; w < 2; w++){
      float s;
      float t = trace(ro, rd, w, s);
      if (t > 0.0 && t < tBest){
        tBest = t; colBest = shade(ro + rd * t, rd, s, w); got = 1;
      }
    }
  } else {
    float s;
    float t = trace(ro, rd, uMode + 1, s);   // 1→2 成键, 2→3 反键
    if (t > 0.0){ tBest = t; colBest = shade(ro + rd * t, rd, s, uMode + 1); got = 1; }
  }

  // 原子核
  if (uNuc == 1){
    for (int k = 0; k < 2; k++){
      vec3 c = (k == 0) ? vec3(0.0, 0.0, uD) : vec3(0.0, 0.0, -uD);
      vec3 nn;
      float tn = hitSphere(ro, rd, c, 0.62, nn);
      if (tn > 0.0 && tn < tBest){
        vec3 L = normalize(vec3(-0.35, 0.72, 0.60));
        float df = max(dot(nn, L), 0.0);
        vec3 nc = vec3(0.72, 0.76, 0.84) * (0.45 + 0.55 * df)
                + vec3(0.2) * pow(1.0 - abs(dot(nn, rd)), 3.0);
        tBest = tn; colBest = nc; got = 1;
      }
    }
  }

  // 坐标轴
  {
    float ta = -1.0; vec3 na = vec3(0.0); int hit = 0;
    for (int i = 0; i < 3; i++){
      float tt; vec3 nn;
      if (cylAxis(ro, rd, i, uAxisLen, uAxisLen * 0.0055, tt, nn)){
        if (hit == 0 || tt < ta){ ta = tt; na = nn; hit = 1; }
      }
    }
    if (hit == 1 && ta < tBest){
      vec3 L = normalize(vec3(-0.35, 0.72, 0.60));
      float df = 0.34 + 0.66 * max(dot(na, L), 0.0);
      tBest = ta;
      colBest = vec3(0.62, 0.68, 0.80) * df + vec3(0.10) * pow(1.0 - abs(dot(na, rd)), 2.0);
      got = 1;
    }
  }

  if (got == 1) col = colBest;
  fragColor = vec4(col, 1.0);
}`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s) || "shader");
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const vbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, "aPos");
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const U = {};
for (const n of ["uRes","uOrigin","uCam","uCamPos","uFocal","uD","uOrb","uMode","uC",
                 "uPeak","uPhase","uNuc","uAxisLen","uBound","uScale"]) {
  U[n] = gl.getUniformLocation(prog, n);
}

/* ---------------- 尺寸 ---------------- */
let W = 0, H = 0, dirty = true;
function resize() {
  if (EXPORT) return;
  const r = stage.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(360, Math.round(r.width * dpr));
  H = Math.max(280, Math.round(r.height * dpr));
  glc.width = W; glc.height = H; ovc.width = W; ovc.height = H;
  dirty = true;
}

/* ---------------- 几何 ---------------- */
function rmaxFor(orb, c) {
  const A = [2 * A20, A22, A22, A21, A21][orb];
  let lo = 6, hi = 95;
  for (let i = 0; i < 70; i++) {
    const m = 0.5 * (lo + hi);
    const v = A * m * m * Math.exp(-m / 3) / PEAK;
    if (v > c) lo = m; else hi = m;
  }
  return 0.5 * (lo + hi);
}

const nrm = (v) => { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0]/l, v[1]/l, v[2]/l]; };
const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];

function camera(dist) {
  const cp = Math.cos(state.pitch), sp = Math.sin(state.pitch);
  const pos = [dist * cp * Math.sin(state.yaw), dist * sp, dist * cp * Math.cos(state.yaw)];
  const fwd = nrm([-pos[0], -pos[1], -pos[2]]);
  let right = nrm(cross(fwd, [0, 1, 0]));
  if (!isFinite(right[0])) right = [1, 0, 0];
  const up = cross(right, fwd);
  return { pos, right, up, fwd };
}

/* ψ 的 JS 版本，用于算重叠积分 */
function psiOne(p, orb) {
  const r2 = p[0]*p[0] + p[1]*p[1] + p[2]*p[2];
  const r = Math.sqrt(r2) || 1e-9;
  const dx = p[0]/r, dy = p[1]/r, dz = p[2]/r;
  let ang;
  if (orb === 0) ang = A20 * (3*dz*dz - 1);
  else if (orb === 1) ang = A22 * (dx*dx - dy*dy);
  else if (orb === 2) ang = A22 * 2 * dx * dy;
  else if (orb === 3) ang = A21 * 2 * dx * dz;
  else ang = A21 * 2 * dy * dz;
  return r2 * Math.exp(-r / 3) * ang / PEAK;
}

function overlapS(orb, d, c, sc) {
  const R = rmaxFor(orb, c) * sc;
  const L = d / 2 + R * 1.1;
  const N = 40;
  const h = (2 * L) / N;
  let sab = 0, saa = 0, sbb = 0;
  for (let i = 0; i < N; i++) {
    const x = -L + (i + 0.5) * h;
    for (let j = 0; j < N; j++) {
      const y = -L + (j + 0.5) * h;
      for (let k = 0; k < N; k++) {
        const z = -L + (k + 0.5) * h;
        const a = psiOne([x / sc, y / sc, (z - d / 2) / sc], orb);
        const b = psiOne([x / sc, y / sc, (z + d / 2) / sc], orb);
        sab += a * b; saa += a * a; sbb += b * b;
      }
    }
  }
  return sab / Math.sqrt(Math.max(saa * sbb, 1e-30));
}

/* ---------------- 渲染 ---------------- */
const FONT = '"Microsoft YaHei","PingFang SC",system-ui,sans-serif';

function render() {
  const c = state.iso;
  const D = state.d / 2;
  const rmax = rmaxFor(state.orb, c) * state.scale;
  const bound = D + rmax + 1.2;
  const axisLen = bound * 0.92;

  const focal = 0.5 * H / Math.tan(FOV / 2);
  const halfV = Math.atan(0.5 * H / focal);
  const halfH = Math.atan(0.5 * W / focal);
  const dist = bound * 1.12 / Math.sin(Math.min(halfV, halfH) * 0.88) / state.zoom;
  const cam = camera(dist);

  gl.disable(gl.SCISSOR_TEST);
  gl.viewport(0, 0, W, H);
  gl.clearColor(0.02, 0.024, 0.033, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);

  gl.uniform2f(U.uRes, W, H);
  gl.uniform2f(U.uOrigin, 0, 0);
  gl.uniform3f(U.uCamPos, cam.pos[0], cam.pos[1], cam.pos[2]);
  gl.uniformMatrix3fv(U.uCam, false, new Float32Array([...cam.right, ...cam.up, ...cam.fwd]));
  gl.uniform1f(U.uFocal, focal);
  gl.uniform1f(U.uD, D);
  gl.uniform1i(U.uOrb, state.orb);
  gl.uniform1i(U.uMode, state.mode);
  gl.uniform1f(U.uC, c);
  gl.uniform1f(U.uPeak, PEAK);
  gl.uniform1i(U.uPhase, state.phase ? 1 : 0);
  gl.uniform1i(U.uNuc, state.nuc ? 1 : 0);
  gl.uniform1f(U.uAxisLen, axisLen);
  gl.uniform1f(U.uScale, state.scale);
  gl.uniform1f(U.uBound, bound);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  drawOverlay(cam, focal, bound, D);
}

function setFont(size, weight) {
  ctx.font = `${weight || 400} ${size}px ${FONT}`;
}

function drawFormula(x, y, size, color, sub) {
  setFont(size * 0.98, 500);
  ctx.fillStyle = color;
  ctx.textBaseline = "alphabetic";
  ctx.fillText("d", x, y);
  const w = ctx.measureText("d").width;
  setFont(size * 0.60, 500);
  ctx.fillText(sub, x + w + size * 0.04, y + size * 0.17);
  return w + size * 0.04 + ctx.measureText(sub).width;
}

function project(pt, cam, focal) {
  const v = [pt[0]-cam.pos[0], pt[1]-cam.pos[1], pt[2]-cam.pos[2]];
  const x = v[0]*cam.right[0] + v[1]*cam.right[1] + v[2]*cam.right[2];
  const y = v[0]*cam.up[0] + v[1]*cam.up[1] + v[2]*cam.up[2];
  const z = v[0]*cam.fwd[0] + v[1]*cam.fwd[1] + v[2]*cam.fwd[2];
  if (z <= 0.01) return null;
  return { x: W/2 + (x/z)*focal, y: H/2 - (y/z)*focal, z };
}

const MODE_TEXT = [
  { t: "分开看", s: "两个中心上的 d 轨道，尚未组合" },
  { t: "成键组合  φA + φB", s: "同号瓣正面重叠 → δ 成键" },
  { t: "反键组合  φA − φB", s: "键中点 z = 0 出现额外节面 → δ*" },
];

function drawOverlay(cam, focal, bound, D) {
  ctx.clearRect(0, 0, W, H);
  const s = Math.min(W, H);
  const pad = s * 0.045;
  const fs = Math.max(15, s * 0.042);

  ctx.shadowColor = "rgba(0,0,0,0.78)";
  ctx.shadowBlur = fs * 0.55;

  setFont(fs * 0.60, 500);
  ctx.fillStyle = "rgba(140,170,220,0.95)";
  ctx.fillText("δ 键 · 面对面重叠", pad, pad + fs * 0.62);

  setFont(fs * 0.80, 500);
  ctx.fillStyle = "#eef3fb";
  ctx.fillText(MODE_TEXT[state.mode].t, pad, pad + fs * 1.55);

  setFont(fs * 0.42, 400);
  ctx.fillStyle = "rgba(160,172,194,0.95)";
  ctx.fillText(MODE_TEXT[state.mode].s, pad, pad + fs * 2.12);

  // 轨道名
  const o = state.orb === 2 ? "xy" : "x²−y²";
  drawFormula(pad, pad + fs * 2.95, fs * 0.52, "rgba(150,162,184,0.9)", o);

  // 距离
  setFont(fs * 0.40, 400);
  ctx.fillStyle = "rgba(130,142,164,0.9)";
  ctx.fillText(`键长（核间距）d = ${state.d.toFixed(1)} a₀`, pad, pad + fs * 3.55);

  // 轴字母
  if (state.nuc) {
    const L = bound * 0.92 * 1.06;
    const fs2 = Math.max(12, s * 0.036);
    setFont(fs2, 500);
    ctx.fillStyle = "rgba(196,206,224,0.92)";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (const [pt, ch] of [[[L,0,0],"x"], [[0,L,0],"y"], [[0,0,L],"z"]]) {
      const q = project(pt, cam, focal);
      if (q) ctx.fillText(ch, q.x, q.y);
    }
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
  }

  // 图例
  if (state.phase) {
    const ly = H - pad;
    const lfs = fs * 0.40;
    setFont(lfs, 400);
    ctx.fillStyle = "rgba(255,107,94,0.95)";
    ctx.beginPath(); ctx.arc(pad + lfs*0.35, ly - lfs*0.32, lfs*0.34, 0, 7); ctx.fill();
    ctx.fillText("ψ > 0", pad + lfs*0.95, ly);
    const off = ctx.measureText("ψ > 0").width;
    ctx.fillStyle = "rgba(91,147,255,0.95)";
    ctx.beginPath(); ctx.arc(pad + lfs*0.35 + off + lfs*1.6, ly - lfs*0.32, lfs*0.34, 0, 7); ctx.fill();
    ctx.fillText("ψ < 0", pad + lfs*0.95 + off + lfs*1.6, ly);
  }

  // 重叠积分
  const S = overlapS(state.orb, state.d, state.iso, state.scale);
  setFont(fs * 0.40, 400);
  ctx.fillStyle = "rgba(150,190,255,0.95)";
  ctx.textAlign = "right";
  ctx.fillText(`重叠积分 S = ${S.toFixed(3)}`, W - pad, H - pad);
  ctx.textAlign = "left";

  ctx.shadowColor = "transparent";
  ctx.shadowBlur = 0;
}

/* ---------------- UI ---------------- */
const modeBtns = document.getElementById("modeBtns");
const orbBtns = document.getElementById("orbBtns");

const EXPLAIN = [
  "两个 d 轨道平行面对面靠近：四对同号瓣正面对上，重叠区沿键轴呈四瓣分布，形成 δ 键。",
  "δ 成键的特征：沿键轴有 2 个节面（xz、yz 平面）；反键组合同样有这 2 个节面，另外在键中点 z = 0 多一个节面。",
];

function syncUI() {
  [...modeBtns.querySelectorAll(".pill")].forEach((b) => {
    b.classList.toggle("on", Number(b.dataset.mode) === state.mode);
  });
  [...orbBtns.querySelectorAll(".pill")].forEach((b) => {
    b.classList.toggle("on", Number(b.dataset.orb) === state.orb);
  });
  document.getElementById("dist").value = String(Math.round(state.d * 10));
  document.getElementById("distVal").textContent = state.d.toFixed(1) + " a₀";
  document.getElementById("scale").value = String(Math.round(state.scale * 100));
  document.getElementById("scaleVal").textContent = state.scale.toFixed(2) + "×";
  document.getElementById("iso").value = String(Math.round(state.iso * 100));
  document.getElementById("isoVal").textContent = state.iso.toFixed(2);
  document.getElementById("swPhase").classList.toggle("on", state.phase);
  document.getElementById("swNuc").classList.toggle("on", state.nuc);
  document.getElementById("swAuto").classList.toggle("on", state.auto);
  document.getElementById("explain").innerHTML =
    "<b>为什么是 δ 键</b><br>" + (state.mode === 2 ? EXPLAIN[1] : EXPLAIN[0]);

  const S = overlapS(state.orb, state.d, state.iso, state.scale);
  document.getElementById("sVal").textContent = S.toFixed(3);
  document.getElementById("sNote").textContent = S > 0.25
    ? "重叠明显：成键 / 反键分裂大"
    : (S > 0.08 ? "中等重叠" : "重叠很小：几乎不相互作用");
}

modeBtns.addEventListener("click", (e) => {
  const b = e.target.closest(".pill");
  if (!b) return;
  state.mode = Number(b.dataset.mode);
  syncUI(); dirty = true;
});
orbBtns.addEventListener("click", (e) => {
  const b = e.target.closest(".pill");
  if (!b) return;
  state.orb = Number(b.dataset.orb);
  syncUI(); dirty = true;
});
document.getElementById("dist").addEventListener("input", (e) => {
  state.d = Number(e.target.value) / 10;
  syncUI(); dirty = true;
});
document.getElementById("scale").addEventListener("input", (e) => {
  state.scale = Number(e.target.value) / 100;
  syncUI(); dirty = true;
});
document.getElementById("iso").addEventListener("input", (e) => {
  state.iso = Number(e.target.value) / 100;
  syncUI(); dirty = true;
});

const toggle = (id, key) => {
  document.getElementById(id).addEventListener("click", () => {
    state[key] = !state[key]; syncUI(); dirty = true;
  });
};
toggle("swPhase", "phase");
toggle("swNuc", "nuc");
toggle("swAuto", "auto");

let drag = null;
stage.addEventListener("pointerdown", (e) => {
  if (EXPORT) return;
  drag = { x: e.clientX, y: e.clientY, yaw: state.yaw, pitch: state.pitch };
  stage.setPointerCapture(e.pointerId);
  stage.classList.add("dragging");
});
stage.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const k = 0.008;
  state.yaw = drag.yaw - (e.clientX - drag.x) * k;
  state.pitch = Math.max(-1.45, Math.min(1.45, drag.pitch + (e.clientY - drag.y) * k));
  dirty = true;
});
const endDrag = (e) => {
  drag = null;
  stage.classList.remove("dragging");
  try { stage.releasePointerCapture(e.pointerId); } catch (_) {}
};
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);
stage.addEventListener("wheel", (e) => {
  if (EXPORT) return;
  e.preventDefault();
  state.zoom = Math.max(0.45, Math.min(3.0, state.zoom * Math.exp(-e.deltaY * 0.0012)));
  dirty = true;
}, { passive: false });

window.addEventListener("keydown", (e) => {
  if (e.key >= "1" && e.key <= "3") { state.mode = Number(e.key) - 1; syncUI(); dirty = true; return; }
  if (e.code === "Space") { e.preventDefault(); state.auto = !state.auto; syncUI(); return; }
  if (e.key === "r" || e.key === "R") {
    state.zoom = 1; state.yaw = 1.15; state.pitch = 0.26; syncUI(); dirty = true;
  }
});

/* ---------------- 导出 ---------------- */
function compose() {
  const tmp = document.createElement("canvas");
  tmp.width = W; tmp.height = H;
  const g = tmp.getContext("2d");
  g.drawImage(glc, 0, 0);
  g.drawImage(ovc, 0, 0);
  return tmp;
}

document.getElementById("save").addEventListener("click", () => {
  render();
  compose().toBlob((blob) => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "delta-bond.png";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    document.getElementById("status").textContent = "已保存 delta-bond.png";
  }, "image/png");
});

/* ---------------- 主循环 ---------------- */
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (state.auto) { state.yaw += dt * 0.20; dirty = true; }
  if (dirty) { render(); dirty = false; }
  requestAnimationFrame(loop);
}

function boot() {
  if (EXPORT) {
    document.body.classList.add("export");
    W = Math.max(200, Number(params.get("w")) || 1400);
    H = Math.max(200, Number(params.get("h")) || W);
    glc.width = W; glc.height = H; ovc.width = W; ovc.height = H;
    if (params.has("mode")) state.mode = Number(params.get("mode"));
    if (params.has("orb")) state.orb = Number(params.get("orb"));
    if (params.has("d")) state.d = Number(params.get("d"));
    if (params.has("sc")) state.scale = Number(params.get("sc"));
    if (params.has("iso")) state.iso = Number(params.get("iso"));
    if (params.has("yaw")) state.yaw = Number(params.get("yaw"));
    if (params.has("pitch")) state.pitch = Number(params.get("pitch"));
    state.auto = false;
    syncUI();
    render();
    setTimeout(async () => {
      try {
        render();
        const blob = await new Promise((r) => compose().toBlob(r, "image/png"));
        const name = params.get("name") || "delta.png";
        await fetch("/save?name=" + encodeURIComponent(name), { method: "POST", body: blob });
        await fetch("/log", { method: "POST", body: JSON.stringify({ exported: name, W, H }) });
        document.title = "EXPORTED";
      } catch (err) {
        fetch("/log", { method: "POST", body: "EXPORT_ERROR " + err });
      }
    }, 300);
    return;
  }

  resize();
  new ResizeObserver(resize).observe(stage);
  if (params.has("mode")) state.mode = Number(params.get("mode"));
  if (params.has("orb")) state.orb = Number(params.get("orb"));
  if (params.has("d")) state.d = Number(params.get("d"));
  if (params.has("sc")) state.scale = Number(params.get("sc"));
  if (params.has("yaw")) state.yaw = Number(params.get("yaw"));
  if (params.has("pitch")) state.pitch = Number(params.get("pitch"));
  if (params.has("yaw") || params.has("pitch")) state.auto = false;
  syncUI();
  requestAnimationFrame(loop);
}

try { boot(); }
catch (err) {
  fetch("/log", { method: "POST", body: "BOOT_ERROR " + (err && err.stack || err) }).catch(() => {});
  throw err;
}
</script>
</body>
</html>
