<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>d 轨道的 σ / π / δ 重叠</title>
<style>
  :root{
    --bg:#0a0c11; --panel:#12151d; --line:#232838; --text:#e8edf7;
    --dim:#8d99b0; --accent:#6ea8fe; --pos:#ff6b5e; --neg:#5b93ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden}
  #app{display:flex;height:100%}
  #stage{position:relative;flex:1;min-width:0;cursor:grab}
  #stage.dragging{cursor:grabbing}
  #stage.scrub{cursor:ew-resize}
  #gl,#ov{position:absolute;inset:0;width:100%;height:100%;display:block}
  #ov{pointer-events:none}

  #ui{width:330px;flex:0 0 330px;background:var(--panel);border-left:1px solid var(--line);
    padding:22px 20px 16px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
  #ui h1{font-size:16.5px;margin:0 0 2px;font-weight:600;letter-spacing:.02em}
  #ui .sub{font-size:12px;color:var(--dim);line-height:1.55;margin:0}

  .group{display:flex;flex-direction:column;gap:8px}
  .group-label{font-size:11px;letter-spacing:.09em;color:var(--dim);text-transform:uppercase}
  .pills{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .pills.three{grid-template-columns:1fr 1fr 1fr}
  .pill{appearance:none;border:1px solid var(--line);background:#181c26;color:var(--text);
    border-radius:9px;padding:8px 4px;font-size:12.5px;cursor:pointer;transition:.15s;
    font-family:inherit;line-height:1.15;text-align:center;position:relative}
  .pill:hover{background:#1e2431;border-color:#2f3651}
  .pill.on{background:rgba(110,168,254,.16);border-color:rgba(110,168,254,.7);color:#d5e5ff}
  .pill small{display:block;font-size:10px;color:var(--dim);margin-top:3px;font-weight:400}
  .pill.on small{color:#9dbdf0}
  .pill .tag{position:absolute;top:4px;right:6px;font-size:10px;color:#7f8ca4}
  .pill.on .tag{color:#a9c8f5}
  .selhint{font-size:11.5px;color:#6d788e;padding-left:2px}

  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;color:#c3ccdd}
  input[type=range]{-webkit-appearance:none;width:100%;height:22px;background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;
    background:linear-gradient(90deg,#3d4a68,#6ea8fe)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
    background:#dce7ff;border:2px solid #4a6ea8;margin-top:-5.5px;box-shadow:0 0 8px rgba(110,168,254,.5)}
  .val{font-variant-numeric:tabular-nums;color:#9fb4d8;font-size:12px;min-width:58px;text-align:right}

  .switch{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:#c3ccdd;
    cursor:pointer;user-select:none;padding:2px 0}
  .switch .track{width:38px;height:21px;border-radius:11px;background:#2a3042;position:relative;transition:.18s;flex:0 0 auto}
  .switch .track::after{content:"";position:absolute;top:3px;left:3px;width:15px;height:15px;border-radius:50%;
    background:#8f9bb3;transition:.18s}
  .switch.on .track{background:rgba(110,168,254,.42)}
  .switch.on .track::after{left:20px;background:#dbe8ff}

  .legend{display:flex;gap:14px;font-size:12px;color:#a9b5c9;align-items:center}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:1px}
  .dot.p{background:var(--pos);box-shadow:0 0 9px rgba(255,107,94,.65)}
  .dot.n{background:var(--neg);box-shadow:0 0 9px rgba(91,147,255,.65)}

  .btn{appearance:none;border:1px solid var(--line);background:#181c26;color:#cfd8e8;
    border-radius:9px;padding:9px 8px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:.15s}
  .btn:hover{background:#1e2431;border-color:#313a55}
  .btn.primary{background:rgba(110,168,254,.16);border-color:rgba(110,168,254,.55);color:#d5e5ff}

  .note{font-size:11.5px;color:#8491a8;line-height:1.7}
  .hint{font-size:11.5px;color:#6d788e;line-height:1.7;margin-top:auto}
  .hint kbd{background:#1c2230;border:1px solid #2a3145;border-radius:4px;padding:0 4px;font-size:10.5px;
    font-family:inherit;color:#9aa7bf}
  #status{font-size:11px;color:#5f6b80;min-height:14px}
  body.export #ui{display:none}
  @media (max-width:880px){
    #app{flex-direction:column}
    #ui{width:auto;flex:0 0 auto;max-height:44vh;border-left:0;border-top:1px solid var(--line)}
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="gl"></canvas>
    <canvas id="ov"></canvas>
  </div>
  <aside id="ui">
    <div>
      <h1>d 轨道的 σ / π / δ 重叠</h1>
      <p class="sub">五个 d 轨道全部可选，可叠加也可并排；拖底部时间轴看靠近成键的过程</p>
    </div>

    <div class="group">
      <div class="group-label">显示轨道（可多选）</div>
      <div class="pills three" id="orbBtns"></div>
      <div class="selhint" id="selHint">已选 5 个</div>
    </div>

    <div class="group">
      <div class="group-label">排布</div>
      <div class="pills" id="layoutBtns">
        <button class="pill on" data-layout="overlay">叠加<small>同屏叠在一起</small></button>
        <button class="pill" data-layout="panels">并排<small>分格对照</small></button>
      </div>
    </div>

    <div class="group">
      <div class="group-label">组合</div>
      <div class="pills" id="bondBtns">
        <button class="pill on" data-bond="1">成键<small>φA + φB</small></button>
        <button class="pill" data-bond="2">反键<small>φA − φB</small></button>
      </div>
    </div>

    <div class="group">
      <div class="row"><span>过程进度</span><span class="val" id="tVal">0%</span></div>
      <input type="range" id="tRange" min="0" max="1000" value="0">
    </div>

    <div class="group">
      <div class="row"><span>轨道缩放（示意）</span><span class="val" id="scaleVal">0.50×</span></div>
      <input type="range" id="scale" min="35" max="100" value="50">
    </div>

    <div class="group">
      <div class="row"><span>电子云范围</span><span class="val" id="isoVal">0.46</span></div>
      <input type="range" id="iso" min="20" max="70" value="46">
    </div>

    <div class="group">
      <div class="switch" id="swPhase"><span>相位配色（红 ψ&gt;0 / 蓝 ψ&lt;0）</span><span class="track"></span></div>
      <div class="switch" id="swNuc"><span>显示原子核与键轴</span><span class="track"></span></div>
      <div class="switch" id="swAuto"><span>自动旋转</span><span class="track"></span></div>
    </div>

    <div class="legend">
      <span><i class="dot p"></i>ψ &gt; 0</span>
      <span><i class="dot n"></i>ψ &lt; 0</span>
    </div>

    <button class="btn primary" id="save">保存 PNG</button>
    <div id="status"></div>

    <div class="hint">拖拽旋转 · 滚轮缩放 · 拖底部时间轴看过程 · <kbd>空格</kbd> 播放/暂停 · <kbd>1</kbd>–<kbd>5</kbd> 勾选轨道</div>
  </aside>
</div>

<script>
"use strict";

const A20 = 0.31539156525, A21 = 0.54627421529, A22 = 0.54627421529;
const PEAK = A20 * 2 * 36 * Math.exp(-2);

const params = new URLSearchParams(location.search);
const EXPORT = params.get("export") === "1";
const FOV = 30 * Math.PI / 180;

/* 五个 d 轨道：每个都在两根轴上各放一个，形成 σ / π / δ 型重叠 */
const ORBS = [
  { sub: "z²",    type: "σ", tail: "头对头（沿键轴）" },
  { sub: "x²−y²", type: "δ", tail: "面对面（平行面正对）" },
  { sub: "xy",    type: "δ", tail: "面对面（平行面正对）" },
  { sub: "xz",    type: "π", tail: "肩并肩（侧面平行）" },
  { sub: "yz",    type: "π", tail: "肩并肩（侧面平行）" },
];

/* 叠加时每个轨道的专属颜色（亮 = ψ>0，暗 = ψ<0） */
const PALETTE = [
  { p: [1.00, 0.56, 0.22], n: [0.40, 0.22, 0.09] },   // d z²
  { p: [0.30, 0.72, 1.00], n: [0.11, 0.29, 0.43] },   // d x²−y²
  { p: [0.40, 0.86, 0.52], n: [0.15, 0.36, 0.21] },   // d xy
  { p: [0.74, 0.56, 1.00], n: [0.30, 0.22, 0.43] },   // d xz
  { p: [1.00, 0.84, 0.34], n: [0.41, 0.34, 0.13] },   // d yz
];
const PHASE_P = [1.00, 0.38, 0.32], PHASE_N = [0.34, 0.58, 1.00];
const MONO_P = [0.62, 0.75, 0.94], MONO_N = [0.40, 0.49, 0.62];

const D_FAR = 20, D_NEAR = 5;
const dOf = (t) => D_FAR * Math.pow(D_NEAR / D_FAR, t);

const state = {
  sel: [0, 1, 2, 3, 4],
  layout: "overlay",
  bond: 1,
  t: 0,
  playing: true,
  dir: 1,
  scale: 0.5,
  iso: 0.46,
  phase: true,
  nuc: true,
  auto: true,
  yaw: 1.12,
  pitch: 0.24,
  zoom: 1,
};

const stage = document.getElementById("stage");
const glc = document.getElementById("gl");
const ovc = document.getElementById("ov");
const ctx = ovc.getContext("2d");

const gl = glc.getContext("webgl2", {
  antialias: true, alpha: false, depth: false, stencil: false,
  preserveDrawingBuffer: true, powerPreference: "high-performance",
});
if (!gl) {
  stage.innerHTML = '<div style="color:#fff;padding:40px;font-size:15px">浏览器不支持 WebGL2，请用新版 Edge / Chrome。</div>';
  throw new Error("no webgl2");
}

const VS = `#version 300 es
in vec2 aPos;
void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }`;

const FS = `#version 300 es
precision highp float;
out vec4 fragColor;

uniform vec2  uRes;
uniform vec2  uOrigin;
uniform mat3  uCam;
uniform vec3  uCamPos;
uniform float uFocal;
uniform float uD;
uniform float uC;
uniform float uPeak;
uniform float uScale;
uniform float uAxisLen;
uniform float uBound;
uniform int   uNuc;

uniform int   uN;         // 槽位数
uniform int   uOrbs[5];
uniform float uSign[5];   // 每槽的成键符号
uniform vec3  uColP[5];
uniform vec3  uColN[5];
uniform float uAlpha;

const float A20 = 0.31539156525;
const float A21 = 0.54627421529;
const float A22 = 0.54627421529;
const int   STEPS = 120;

float angY(vec3 d, int orb){
  if (orb == 0) return A20 * (3.0 * d.z * d.z - 1.0);
  if (orb == 1) return A22 * (d.x * d.x - d.y * d.y);
  if (orb == 2) return A22 * 2.0 * d.x * d.y;
  if (orb == 3) return A21 * 2.0 * d.x * d.z;
  return A21 * 2.0 * d.y * d.z;
}

float psi1(vec3 q, int orb){
  vec3 p = q / uScale;
  float r2 = dot(p, p);
  float r  = sqrt(r2);
  vec3  d  = p / max(r, 1e-6);
  return r2 * exp(-r * 0.3333333333) * angY(d, orb) / uPeak;
}

float psiSlot(vec3 p, int i){
  int orb = uOrbs[i];
  float a = psi1(p - vec3(0.0, 0.0, uD), orb);
  float b = psi1(p + vec3(0.0, 0.0, uD), orb);
  return (a + uSign[i] * b) * 0.70710678;
}

float fieldSlot(vec3 p, int i){ return abs(psiSlot(p, i)) - uC; }

bool sphereIn(vec3 ro, vec3 rd, float R, out float t0, out float t1){
  float b = dot(ro, rd);
  float c = dot(ro, ro) - R * R;
  float h = b * b - c;
  if (h < 0.0){ t0 = 0.0; t1 = 0.0; return false; }
  h = sqrt(h);
  t0 = -b - h;
  t1 = -b + h;
  return t1 > 0.0;
}

float traceSlot(vec3 ro, vec3 rd, int i, out float sgn){
  sgn = 0.0;
  float t0, t1;
  if (!sphereIn(ro, rd, uBound, t0, t1)) return -1.0;
  t0 = max(t0, 0.0);
  float dt = (t1 - t0) / float(STEPS);
  float tp = t0;
  float fp = fieldSlot(ro + rd * t0, i);
  for (int k = 1; k <= STEPS; k++){
    float tc = t0 + dt * float(k);
    float fc = fieldSlot(ro + rd * tc, i);
    if (fc > 0.0 && fp <= 0.0){
      float a = tp, b = tc;
      for (int m = 0; m < 7; m++){
        float mid = 0.5 * (a + b);
        if (fieldSlot(ro + rd * mid, i) > 0.0) b = mid; else a = mid;
      }
      float th = 0.5 * (a + b);
      sgn = psiSlot(ro + rd * th, i);
      return th;
    }
    tp = tc; fp = fc;
  }
  return -1.0;
}

vec3 shade(vec3 p, vec3 rd, float sgn, int slot){
  float e = uBound * 0.0022;
  vec3 g = vec3(
    psiSlot(p + vec3(e,0.0,0.0), slot) - psiSlot(p - vec3(e,0.0,0.0), slot),
    psiSlot(p + vec3(0.0,e,0.0), slot) - psiSlot(p - vec3(0.0,e,0.0), slot),
    psiSlot(p + vec3(0.0,0.0,e), slot) - psiSlot(p - vec3(0.0,0.0,e), slot)
  );
  vec3 n = (length(g) > 1e-14) ? normalize(g) : vec3(0.0,0.0,1.0);
  n = -sign(sgn) * n;

  vec3 L1 = normalize(vec3(-0.34, 0.74, 0.58));
  vec3 L2 = normalize(vec3(0.72, -0.18, 0.32));
  float d1 = max(dot(n, L1), 0.0);
  float d2 = max(dot(n, L2), 0.0);
  float amb = 0.52 + 0.26 * (0.5 + 0.5 * n.y);

  vec3 base = (sgn > 0.0) ? uColP[slot] : uColN[slot];

  vec3 col = base * (amb + 0.72 * d1 + 0.20 * d2);
  vec3 hv = normalize(L1 - rd);
  col += vec3(0.92,0.96,1.0) * pow(max(dot(n, hv), 0.0), 52.0) * 0.22;
  float rim = pow(1.0 - clamp(dot(n, -rd), 0.0, 1.0), 3.6);
  col += base * rim * (0.42 + (1.0 - uAlpha) * 1.05);
  float edge = pow(1.0 - abs(dot(n, L1)), 2.0);
  col *= 1.0 - 0.22 * edge;
  return col;
}

float hitSphere(vec3 ro, vec3 rd, vec3 c, float r, out vec3 nrm){
  vec3 oc = ro - c;
  float b = dot(oc, rd);
  float q = dot(oc, oc) - r * r;
  float h = b * b - q;
  nrm = vec3(0.0, 0.0, 1.0);
  if (h < 0.0) return -1.0;
  h = sqrt(h);
  float t = -b - h;
  if (t < 0.0) t = -b + h;
  if (t < 0.0) return -1.0;
  nrm = normalize(ro + rd * t - c);
  return t;
}

bool cylAxis(vec3 ro, vec3 rd, int ax, float L, float rad, out float tOut, out vec3 nOut){
  vec2 oc, dc; float oa, da;
  if (ax == 0){ oc = ro.yz; dc = rd.yz; oa = ro.x; da = rd.x; }
  else if (ax == 1){ oc = ro.xz; dc = rd.xz; oa = ro.y; da = rd.y; }
  else { oc = ro.xy; dc = rd.xy; oa = ro.z; da = rd.z; }
  float A = dot(dc, dc);
  if (A < 1e-9) return false;
  float B = 2.0 * dot(oc, dc);
  float C = dot(oc, oc) - rad * rad;
  float disc = B * B - 4.0 * A * C;
  if (disc < 0.0) return false;
  float sq = sqrt(disc);
  float ts0 = (-B - sq) / (2.0 * A);
  float ts1 = (-B + sq) / (2.0 * A);
  for (int k = 0; k < 2; k++){
    float t = (k == 0) ? ts0 : ts1;
    if (t > 0.0){
      float a = oa + da * t;
      if (abs(a) <= L){
        vec3 p = ro + rd * t;
        vec3 dd = p; if (ax == 0) dd.x = 0.0; else if (ax == 1) dd.y = 0.0; else dd.z = 0.0;
        nOut = normalize(dd + vec3(1e-9));
        tOut = t;
        return true;
      }
    }
  }
  return false;
}

void main(){
  vec2 fc = gl_FragCoord.xy - uOrigin;
  vec3 rd = normalize(uCam * vec3((fc - 0.5 * uRes) / uFocal, 1.0));
  vec3 ro = uCamPos;

  vec2 q = fc / uRes;
  float rr = length(q - vec2(0.5));
  vec3 bg = mix(vec3(0.068,0.076,0.098), vec3(0.014,0.017,0.025), smoothstep(0.10,0.92,rr));
  bg += vec3(0.018,0.026,0.042) * pow(max(0.0, 1.0 - rr*1.55), 2.2);

  float ts[5]; float sg[5]; int sl[5]; int n = 0;
  for (int i = 0; i < 5; i++){
    if (i < uN){
      float s;
      float t = traceSlot(ro, rd, i, s);
      if (t > 0.0){ ts[n] = t; sg[n] = s; sl[n] = i; n++; }
    }
  }
  for (int a = 1; a < n; a++){
    float kt = ts[a]; float ks = sg[a]; int ki = sl[a];
    int b = a - 1;
    while (b >= 0 && ts[b] > kt){
      ts[b+1] = ts[b]; sg[b+1] = sg[b]; sl[b+1] = sl[b];
      b--;
    }
    ts[b+1] = kt; sg[b+1] = ks; sl[b+1] = ki;
  }

  vec3 col = bg;
  for (int k = n - 1; k >= 0; k--){
    vec3 c = shade(ro + rd * ts[k], rd, sg[k], sl[k]);
    col = mix(col, c, uAlpha);
  }

  float tMin = (n > 0) ? ts[0] : 1e9;

  if (uNuc == 1){
    for (int k = 0; k < 2; k++){
      vec3 c = (k == 0) ? vec3(0.0, 0.0, uD) : vec3(0.0, 0.0, -uD);
      vec3 nn;
      float tn = hitSphere(ro, rd, c, 0.55, nn);
      if (tn > 0.0 && tn < tMin){
        vec3 L = normalize(vec3(-0.35, 0.72, 0.60));
        float df = max(dot(nn, L), 0.0);
        tMin = tn;
        col = vec3(0.72, 0.76, 0.84) * (0.45 + 0.55 * df)
            + vec3(0.2) * pow(1.0 - abs(dot(nn, rd)), 3.0);
      }
    }
  }

  {
    float ta = -1.0; vec3 na = vec3(0.0); int hit = 0;
    for (int i = 0; i < 3; i++){
      float tt; vec3 nn;
      if (cylAxis(ro, rd, i, uAxisLen, uAxisLen * 0.0055, tt, nn)){
        if (hit == 0 || tt < ta){ ta = tt; na = nn; hit = 1; }
      }
    }
    if (hit == 1 && ta < tMin){
      vec3 L = normalize(vec3(-0.35, 0.72, 0.60));
      float df = 0.34 + 0.66 * max(dot(na, L), 0.0);
      col = vec3(0.62, 0.68, 0.80) * df + vec3(0.10) * pow(1.0 - abs(dot(na, rd)), 2.0);
    }
  }

  fragColor = vec4(col, 1.0);
}`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s) || "shader");
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const vbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, "aPos");
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const U = {};
for (const n of ["uRes","uOrigin","uCam","uCamPos","uFocal","uD","uC","uPeak","uScale",
                 "uAxisLen","uBound","uNuc","uN","uOrbs","uSign","uColP","uColN","uAlpha"]) {
  U[n] = gl.getUniformLocation(prog, n);
}

/* ---------------- 尺寸 ---------------- */
let W = 0, H = 0, dirty = true;
function resize() {
  if (EXPORT) return;
  const r = stage.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(360, Math.round(r.width * dpr));
  H = Math.max(280, Math.round(r.height * dpr));
  glc.width = W; glc.height = H; ovc.width = W; ovc.height = H;
  dirty = true;
}

/* ---------------- 几何 ---------------- */
function rmaxFor(orb, c) {
  const A = [2 * A20, A22, A22, A21, A21][orb];
  let lo = 6, hi = 95;
  for (let i = 0; i < 70; i++) {
    const m = 0.5 * (lo + hi);
    const v = A * m * m * Math.exp(-m / 3) / PEAK;
    if (v > c) lo = m; else hi = m;
  }
  return 0.5 * (lo + hi);
}

const nrm = (v) => { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0]/l, v[1]/l, v[2]/l]; };
const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];

function camera(dist) {
  const cp = Math.cos(state.pitch), sp = Math.sin(state.pitch);
  const pos = [dist * cp * Math.sin(state.yaw), dist * sp, dist * cp * Math.cos(state.yaw)];
  const fwd = nrm([-pos[0], -pos[1], -pos[2]]);
  let right = nrm(cross(fwd, [0, 1, 0]));
  if (!isFinite(right[0])) right = [1, 0, 0];
  const up = cross(right, fwd);
  return { pos, right, up, fwd };
}

/* ---------------- 布局 ---------------- */
const TL_H = 0.16;   // 时间轴占画面高度比例

function layoutPanels() {
  const n = state.sel.length;
  const tlH = H * TL_H;
  const pad = Math.min(W, H) * 0.025;
  const availW = W - pad * 2;
  const availH = H - tlH - pad * 2;
  const gap = Math.min(W, H) * 0.02;

  if (n <= 3) {
    const s = Math.floor(Math.min((availW - gap * (n - 1)) / n, availH));
    const totalW = s * n + gap * (n - 1);
    const x0 = Math.round((W - totalW) / 2);
    const y0 = Math.round(Math.max(pad * 0.6, (H - tlH - s) / 2));
    return state.sel.map((oi, i) => ({ x: x0 + i * (s + gap), y: y0, w: s, h: s, oi }));
  }
  // 4~5 个：3 上 2 下
  const top = 3, bottom = n - 3;
  const s = Math.floor(Math.min((availW - 2 * gap) / 3, (availH - gap) / 2));
  const totalW = 3 * s + 2 * gap;
  const x0 = Math.round((W - totalW) / 2);
  const y0 = Math.round(Math.max(pad * 0.5, (H - tlH - (2 * s + gap)) / 2));
  const out = [];
  for (let i = 0; i < top; i++) out.push({ x: x0 + i * (s + gap), y: y0, w: s, h: s, oi: state.sel[i] });
  const w2 = 2 * s + gap;
  const x1 = Math.round((W - w2) / 2);
  for (let i = 0; i < bottom; i++) out.push({ x: x1 + i * (s + gap), y: y0 + s + gap, w: s, h: s, oi: state.sel[3 + i] });
  return out;
}

/* ---------------- 渲染 ---------------- */
const FONT = '"Microsoft YaHei","PingFang SC",system-ui,sans-serif';

let tlRect = { x: 0, y: 0, w: 1, h: 1 };

function render() {
  const c = state.iso;
  const d = dOf(state.t);
  const D = d / 2;

  let rmaxMax = 0;
  for (const oi of state.sel) rmaxMax = Math.max(rmaxMax, rmaxFor(oi, c) * state.scale);
  const bound = D_FAR / 2 + rmaxMax + 0.8;

  gl.disable(gl.SCISSOR_TEST);
  gl.viewport(0, 0, W, H);
  gl.clearColor(0.02, 0.024, 0.033, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.SCISSOR_TEST);

  gl.uniform1f(U.uPeak, PEAK);
  gl.uniform1f(U.uC, c);
  gl.uniform1f(U.uD, D);
  gl.uniform1f(U.uScale, state.scale);
  gl.uniform1i(U.uNuc, state.nuc ? 1 : 0);
  const overlay = state.layout === "overlay";
  const panels = overlay ? [{ x: 0, y: 0, w: W, h: Math.round(H - H * TL_H * 0.55), oi: -1 }] : layoutPanels();

  for (const p of panels) {
    const focal = 0.5 * p.h / Math.tan(FOV / 2);
    const halfV = Math.atan(0.5 * p.h / focal);
    const halfH = Math.atan(0.5 * p.w / focal);
    const Rv = rmaxMax * 1.22 + 0.9;
    const Rh = D_FAR / 2 + rmaxMax + 0.8;
    const dist = Math.max(Rv / Math.sin(halfV * 0.90), Rh / Math.sin(halfH * 0.90)) / state.zoom;
    const cam = camera(dist);
    const slots = overlay ? state.sel.slice(0, 5) : [p.oi];
    const n = slots.length;

    const cp = new Float32Array(15), cn = new Float32Array(15);
    const ids = new Int32Array(5);
    const sgn = new Float32Array(5);
    for (let i = 0; i < 5; i++) {
      const oi = slots[Math.min(i, n - 1)];
      ids[i] = oi;
      sgn[i] = state.bond === 1 ? 1.0 : -1.0;
      let P, N;
      if (n === 1) {
        P = state.phase ? PHASE_P : MONO_P;
        N = state.phase ? PHASE_N : MONO_N;
      } else {
        P = PALETTE[oi].p;
        N = state.phase ? PALETTE[oi].n : PALETTE[oi].p;
      }
      cp[i*3] = P[0]; cp[i*3+1] = P[1]; cp[i*3+2] = P[2];
      cn[i*3] = N[0]; cn[i*3+1] = N[1]; cn[i*3+2] = N[2];
    }

    gl.uniform3f(U.uCamPos, cam.pos[0], cam.pos[1], cam.pos[2]);
    gl.uniformMatrix3fv(U.uCam, false, new Float32Array([...cam.right, ...cam.up, ...cam.fwd]));
    p.cam = cam;
    gl.viewport(p.x, H - p.y - p.h, p.w, p.h);
    gl.scissor(p.x, H - p.y - p.h, p.w, p.h);
    gl.uniform2f(U.uRes, p.w, p.h);
    gl.uniform2f(U.uOrigin, p.x, H - p.y - p.h);
    gl.uniform1f(U.uFocal, focal);
    gl.uniform1f(U.uBound, bound);
    gl.uniform1f(U.uAxisLen, bound * 0.92);
    gl.uniform1i(U.uN, n);
    gl.uniform1iv(U.uOrbs, ids);
    gl.uniform1fv(U.uSign, sgn);
    gl.uniform3fv(U.uColP, cp);
    gl.uniform3fv(U.uColN, cn);
    gl.uniform1f(U.uAlpha, n === 1 ? 1.0 : (n === 2 ? 0.72 : 0.42));
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    p.focal = focal;
  }

  gl.disable(gl.SCISSOR_TEST);
  drawOverlay(panels, bound, d, overlay);
}

function setFont(size, weight) {
  ctx.font = `${weight || 400} ${size}px ${FONT}`;
}

function drawFormula(x, y, size, color, sub) {
  setFont(size * 0.98, 500);
  ctx.fillStyle = color;
  ctx.textBaseline = "alphabetic";
  ctx.fillText("d", x, y);
  const w = ctx.measureText("d").width;
  setFont(size * 0.60, 500);
  ctx.fillText(sub, x + w + size * 0.04, y + size * 0.17);
  return w + size * 0.04 + ctx.measureText(sub).width;
}

function project(pt, cam, focal, rect) {
  const v = [pt[0]-cam.pos[0], pt[1]-cam.pos[1], pt[2]-cam.pos[2]];
  const x = v[0]*cam.right[0] + v[1]*cam.right[1] + v[2]*cam.right[2];
  const y = v[0]*cam.up[0] + v[1]*cam.up[1] + v[2]*cam.up[2];
  const z = v[0]*cam.fwd[0] + v[1]*cam.fwd[1] + v[2]*cam.fwd[2];
  if (z <= 0.01) return null;
  return { x: rect.x + rect.w/2 + (x/z)*focal, y: rect.y + rect.h/2 - (y/z)*focal };
}

function drawOverlay(panels, bound, d, overlay) {
  ctx.clearRect(0, 0, W, H);
  const s0 = Math.min(W, H);

  for (const p of panels) {
    // 轴字母
    if (state.nuc) {
      const L = bound * 0.92 * 1.05;
      const fs2 = Math.max(11, Math.min(p.w, p.h) * 0.042);
      setFont(fs2, 500);
      ctx.fillStyle = "rgba(196,206,224,0.9)";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      for (const [pt, ch] of [[[L,0,0],"x"], [[0,L,0],"y"], [[0,0,L],"z"]]) {
        const q = project(pt, p.cam, p.focal, p);
        if (q && q.x > p.x - 2 && q.x < p.x + p.w + 2 && q.y > p.y - 2 && q.y < p.y + p.h + 2) {
          ctx.fillText(ch, q.x, q.y);
        }
      }
      ctx.textAlign = "left";
      ctx.textBaseline = "alphabetic";
    }
  }

  if (overlay) drawLegend();
  else drawPanelLabels(panels, s0);

  drawTimeline(d);
}

function drawLegend() {
  const pad = Math.min(W, H) * 0.038;
  const n = state.sel.length;
  const fs = Math.max(13, Math.min(W, H) * 0.026);
  const rowH = fs * 1.28;

  ctx.shadowColor = "rgba(0,0,0,0.8)";
  ctx.shadowBlur = fs * 0.5;

  setFont(fs * 0.92, 500);
  ctx.fillStyle = "#eef3fb";
  ctx.fillText(n === 1 ? "单轨道" : "叠加对比", pad, pad + fs * 0.85);

  setFont(fs * 0.46, 400);
  ctx.fillStyle = "rgba(150,162,184,0.95)";
  ctx.fillText(n === 1 ? "红 ψ>0　蓝 ψ<0" : "颜色区分轨道 · 亮/暗 = ψ 正/负", pad, pad + fs * 1.45);

  let y = pad + fs * 2.35;
  for (const oi of state.sel) {
    const O = ORBS[oi];
    const col = PALETTE[oi].p;
    ctx.fillStyle = `rgb(${Math.round(col[0]*255)},${Math.round(col[1]*255)},${Math.round(col[2]*255)})`;
    ctx.beginPath();
    ctx.arc(pad + fs * 0.26, y - fs * 0.27, fs * 0.26, 0, 7);
    ctx.fill();
    let x = pad + fs * 0.70;
    x += drawFormula(x, y, fs * 0.88, "#dfe7f4", O.sub);
    setFont(fs * 0.50, 400);
    ctx.fillStyle = "rgba(150,162,184,0.95)";
    ctx.fillText(`· ${O.type} 型　${O.tail}`, x + fs * 0.22, y);
    y += rowH;
  }

  if (n === 5) {
    setFont(fs * 0.46, 400);
    ctx.fillStyle = "rgba(140,190,255,0.9)";
    ctx.fillText("五个全叠加 ≈ 球形（Σ|ψ|² 与方向无关）", pad, y + fs * 0.2);
  }

  ctx.shadowColor = "transparent";
  ctx.shadowBlur = 0;
}

function drawPanelLabels(panels, s0) {
  for (const p of panels) {
    const O = ORBS[p.oi];
    const pad = p.w * 0.05;
    const fs = Math.max(12, p.w * (panels.length > 3 ? 0.055 : 0.045));

    ctx.strokeStyle = "rgba(255,255,255,0.055)";
    ctx.lineWidth = Math.max(1, W * 0.0012);
    ctx.strokeRect(p.x + 1, p.y + 1, p.w - 2, p.h - 2);

    ctx.shadowColor = "rgba(0,0,0,0.78)";
    ctx.shadowBlur = fs * 0.55;

    setFont(fs * 1.05, 600);
    ctx.fillStyle = "#eef3fb";
    ctx.fillText(O.type, p.x + pad, p.y + pad + fs * 0.95);

    drawFormula(p.x + pad + fs * 1.15, p.y + pad + fs * 0.95, fs * 0.70, "#dfe7f4", O.sub);

    setFont(fs * 0.42, 400);
    ctx.fillStyle = "rgba(150,162,184,0.95)";
    ctx.fillText(O.tail, p.x + pad, p.y + pad + fs * 1.5);

    ctx.shadowColor = "transparent";
    ctx.shadowBlur = 0;
  }
}

function drawTimeline(d) {
  const s0 = Math.min(W, H);
  const pad = s0 * 0.045;
  const y = H - s0 * TL_H * 0.62;
  const btnR = s0 * 0.024;
  const bx = pad + btnR;
  const trackX = bx + btnR + s0 * 0.03;
  const trackW = W - trackX - pad;

  tlRect = { x: trackX, y: y - s0 * 0.055, w: trackW, h: s0 * 0.11 };

  ctx.save();
  ctx.beginPath();
  ctx.arc(bx, y, btnR, 0, 7);
  ctx.fillStyle = "rgba(110,168,254,0.20)";
  ctx.fill();
  ctx.strokeStyle = "rgba(110,168,254,0.75)";
  ctx.lineWidth = Math.max(1, s0 * 0.0018);
  ctx.stroke();
  ctx.fillStyle = "#cfe1ff";
  if (state.playing) {
    const bw = btnR * 0.22, bh = btnR * 0.62;
    ctx.fillRect(bx - bw * 1.2, y - bh / 2, bw, bh);
    ctx.fillRect(bx + bw * 0.2, y - bh / 2, bw, bh);
  } else {
    ctx.beginPath();
    ctx.moveTo(bx - btnR * 0.24, y - btnR * 0.38);
    ctx.lineTo(bx + btnR * 0.42, y);
    ctx.lineTo(bx - btnR * 0.24, y + btnR * 0.38);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  const th = Math.max(3, s0 * 0.006);
  ctx.strokeStyle = "rgba(255,255,255,0.14)";
  ctx.lineWidth = th;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(trackX, y);
  ctx.lineTo(trackX + trackW, y);
  ctx.stroke();

  const px = trackX + trackW * state.t;
  const g = ctx.createLinearGradient(trackX, 0, trackX + trackW, 0);
  g.addColorStop(0, "rgba(110,168,254,0.55)");
  g.addColorStop(1, "rgba(160,205,255,0.95)");
  ctx.strokeStyle = g;
  ctx.beginPath();
  ctx.moveTo(trackX, y);
  ctx.lineTo(px, y);
  ctx.stroke();

  for (const [f, label] of [[0.02, "相距很远"], [0.5, "靠近中"], [0.985, "重叠成键"]]) {
    const mx = trackX + trackW * f;
    ctx.beginPath();
    ctx.arc(mx, y, th * 0.9, 0, 7);
    ctx.fillStyle = "rgba(200,215,240,0.55)";
    ctx.fill();
    setFont(s0 * 0.019, 400);
    ctx.fillStyle = "rgba(140,152,174,0.9)";
    ctx.textAlign = f < 0.1 ? "left" : (f > 0.9 ? "right" : "center");
    ctx.fillText(label, mx, y + s0 * 0.042);
  }
  ctx.textAlign = "left";

  ctx.beginPath();
  ctx.arc(px, y, s0 * 0.014, 0, 7);
  ctx.fillStyle = "#eaf2ff";
  ctx.shadowColor = "rgba(110,168,254,0.9)";
  ctx.shadowBlur = s0 * 0.02;
  ctx.fill();
  ctx.shadowBlur = 0;

  setFont(s0 * 0.022, 500);
  ctx.fillStyle = "rgba(190,210,240,0.95)";
  const label = `核间距 d = ${d.toFixed(1)} a₀`;
  const tw = ctx.measureText(label).width;
  let lx = px - tw / 2;
  lx = Math.max(trackX, Math.min(lx, trackX + trackW - tw));
  ctx.fillText(label, lx, y - s0 * 0.045);
}

/* ---------------- UI ---------------- */
const orbBtns = document.getElementById("orbBtns");
const layoutBtns = document.getElementById("layoutBtns");
const bondBtns = document.getElementById("bondBtns");

ORBS.forEach((O, i) => {
  const b = document.createElement("button");
  b.className = "pill";
  b.innerHTML = `<span class="tag">${O.type}</span>d<sub>${O.sub}</sub>`;
  b.dataset.orb = String(i);
  orbBtns.appendChild(b);
});

function syncUI() {
  [...orbBtns.querySelectorAll(".pill")].forEach((b) => {
    b.classList.toggle("on", state.sel.includes(Number(b.dataset.orb)));
  });
  [...layoutBtns.querySelectorAll(".pill")].forEach((b) => {
    b.classList.toggle("on", b.dataset.layout === state.layout);
  });
  [...bondBtns.querySelectorAll(".pill")].forEach((b) => {
    b.classList.toggle("on", Number(b.dataset.bond) === state.bond);
  });
  document.getElementById("selHint").textContent = `已选 ${state.sel.length} 个轨道`;
  document.getElementById("tRange").value = String(Math.round(state.t * 1000));
  document.getElementById("tVal").textContent = Math.round(state.t * 100) + "%";
  document.getElementById("scale").value = String(Math.round(state.scale * 100));
  document.getElementById("scaleVal").textContent = state.scale.toFixed(2) + "×";
  document.getElementById("iso").value = String(Math.round(state.iso * 100));
  document.getElementById("isoVal").textContent = state.iso.toFixed(2);
  document.getElementById("swPhase").classList.toggle("on", state.phase);
  document.getElementById("swNuc").classList.toggle("on", state.nuc);
  document.getElementById("swAuto").classList.toggle("on", state.auto);
}

function toggleOrb(i) {
  const k = state.sel.indexOf(i);
  if (k >= 0) { if (state.sel.length === 1) return; state.sel.splice(k, 1); }
  else { state.sel.push(i); state.sel.sort((a, b) => a - b); }
  syncUI(); dirty = true;
}

orbBtns.addEventListener("click", (e) => {
  const b = e.target.closest(".pill");
  if (!b) return;
  toggleOrb(Number(b.dataset.orb));
});
layoutBtns.addEventListener("click", (e) => {
  const b = e.target.closest(".pill");
  if (!b) return;
  state.layout = b.dataset.layout;
  syncUI(); dirty = true;
});
bondBtns.addEventListener("click", (e) => {
  const b = e.target.closest(".pill");
  if (!b) return;
  state.bond = Number(b.dataset.bond);
  syncUI(); dirty = true;
});

document.getElementById("tRange").addEventListener("input", (e) => {
  state.t = Number(e.target.value) / 1000;
  state.playing = false;
  syncUI(); dirty = true;
});
document.getElementById("scale").addEventListener("input", (e) => {
  state.scale = Number(e.target.value) / 100;
  syncUI(); dirty = true;
});
document.getElementById("iso").addEventListener("input", (e) => {
  state.iso = Number(e.target.value) / 100;
  syncUI(); dirty = true;
});

const toggle = (id, key) => {
  document.getElementById(id).addEventListener("click", () => {
    state[key] = !state[key]; syncUI(); dirty = true;
  });
};
toggle("swPhase", "phase");
toggle("swNuc", "nuc");
toggle("swAuto", "auto");

/* ---------------- 交互 ---------------- */
function canvasPt(e) {
  const r = ovc.getBoundingClientRect();
  return [(e.clientX - r.left) * (W / r.width), (e.clientY - r.top) * (H / r.height)];
}

let mode = null, drag = null;

stage.addEventListener("pointerdown", (e) => {
  if (EXPORT) return;
  const [x, y] = canvasPt(e);
  if (y > tlRect.y) {
    const s0 = Math.min(W, H);
    const pad = s0 * 0.045;
    const bx = pad + s0 * 0.024;
    if (Math.hypot(x - bx, y - (H - s0 * TL_H * 0.62)) < s0 * 0.05) {
      state.playing = !state.playing;
      if (state.playing && state.t >= 0.999) { state.t = 0; state.dir = 1; }
      syncUI(); dirty = true;
      return;
    }
    mode = "scrub";
    state.playing = false;
    scrubTo(x);
    stage.classList.add("scrub");
  } else {
    mode = "rotate";
    drag = { x: e.clientX, y: e.clientY, yaw: state.yaw, pitch: state.pitch };
    stage.classList.add("dragging");
  }
  stage.setPointerCapture(e.pointerId);
});

function scrubTo(x) {
  state.t = Math.max(0, Math.min(1, (x - tlRect.x) / tlRect.w));
  syncUI(); dirty = true;
}

stage.addEventListener("pointermove", (e) => {
  if (EXPORT || !mode) return;
  if (mode === "scrub") { const [x] = canvasPt(e); scrubTo(x); return; }
  const k = 0.008;
  state.yaw = drag.yaw - (e.clientX - drag.x) * k;
  state.pitch = Math.max(-1.45, Math.min(1.45, drag.pitch + (e.clientY - drag.y) * k));
  dirty = true;
});

const endDrag = (e) => {
  mode = null;
  stage.classList.remove("dragging", "scrub");
  try { stage.releasePointerCapture(e.pointerId); } catch (_) {}
};
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);

stage.addEventListener("wheel", (e) => {
  if (EXPORT) return;
  e.preventDefault();
  state.zoom = Math.max(0.45, Math.min(3.0, state.zoom * Math.exp(-e.deltaY * 0.0012)));
  dirty = true;
}, { passive: false });

window.addEventListener("keydown", (e) => {
  if (e.key >= "1" && e.key <= "5") { toggleOrb(Number(e.key) - 1); return; }
  if (e.code === "Space") {
    e.preventDefault();
    state.playing = !state.playing;
    if (state.playing && state.t >= 0.999) { state.t = 0; state.dir = 1; }
    syncUI(); dirty = true; return;
  }
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
    e.preventDefault();
    state.playing = false;
    state.t = Math.max(0, Math.min(1, state.t + (e.key === "ArrowRight" ? 0.02 : -0.02)));
    syncUI(); dirty = true;
  }
  if (e.key === "g" || e.key === "G") {
    state.layout = state.layout === "overlay" ? "panels" : "overlay";
    syncUI(); dirty = true;
  }
});

/* ---------------- 导出 ---------------- */
function compose() {
  const tmp = document.createElement("canvas");
  tmp.width = W; tmp.height = H;
  const g = tmp.getContext("2d");
  g.drawImage(glc, 0, 0);
  g.drawImage(ovc, 0, 0);
  return tmp;
}

document.getElementById("save").addEventListener("click", () => {
  render();
  compose().toBlob((blob) => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "d-orbital-sigma-pi-delta.png";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    document.getElementById("status").textContent = "已保存 PNG";
  }, "image/png");
});

/* ---------------- 主循环 ---------------- */
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (state.auto) { state.yaw += dt * 0.16; dirty = true; }
  if (state.playing) {
    state.t += state.dir * dt / 7;
    if (state.t >= 1) { state.t = 1; state.dir = -1; }
    if (state.t <= 0) { state.t = 0; state.dir = 1; }
    syncUI();
    dirty = true;
  }
  if (dirty) { render(); dirty = false; }
  requestAnimationFrame(loop);
}

function applySel(str) {
  state.sel = str.split(",").map(Number).filter((x) => x >= 0 && x < 5);
  if (!state.sel.length) state.sel = [0];
  state.sel.sort((a, b) => a - b);
}

function boot() {
  if (EXPORT) {
    document.body.classList.add("export");
    W = Math.max(200, Number(params.get("w")) || 1400);
    H = Math.max(200, Number(params.get("h")) || W);
    glc.width = W; glc.height = H; ovc.width = W; ovc.height = H;
    if (params.has("sel")) applySel(params.get("sel"));
    if (params.has("layout")) state.layout = params.get("layout");
    if (params.has("bond")) state.bond = Number(params.get("bond"));
    if (params.has("t")) state.t = Number(params.get("t"));
    if (params.has("sc")) state.scale = Number(params.get("sc"));
    if (params.has("iso")) state.iso = Number(params.get("iso"));
    if (params.has("yaw")) state.yaw = Number(params.get("yaw"));
    if (params.has("pitch")) state.pitch = Number(params.get("pitch"));
    state.auto = false; state.playing = false;
    syncUI();
    render();
    setTimeout(async () => {
      try {
        render();
        const blob = await new Promise((r) => compose().toBlob(r, "image/png"));
        const name = params.get("name") || "overlap.png";
        await fetch("/save?name=" + encodeURIComponent(name), { method: "POST", body: blob });
        await fetch("/log", { method: "POST", body: JSON.stringify({ exported: name, W, H }) });
        document.title = "EXPORTED";
      } catch (err) {
        fetch("/log", { method: "POST", body: "EXPORT_ERROR " + err });
      }
    }, 300);
    return;
  }

  resize();
  new ResizeObserver(resize).observe(stage);
  if (params.has("sel")) applySel(params.get("sel"));
  if (params.has("layout")) state.layout = params.get("layout");
  if (params.has("t")) { state.t = Number(params.get("t")); state.playing = false; }
  if (params.has("yaw")) state.yaw = Number(params.get("yaw"));
  if (params.has("pitch")) state.pitch = Number(params.get("pitch"));
  if (params.has("yaw") || params.has("pitch")) state.auto = false;
  syncUI();
  requestAnimationFrame(loop);
}

try { boot(); }
catch (err) {
  fetch("/log", { method: "POST", body: "BOOT_ERROR " + (err && err.stack || err) }).catch(() => {});
  throw err;
}
</script>
</body>
</html>
